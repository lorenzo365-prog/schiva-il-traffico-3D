<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schiva 3D</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0a12; font-family: Arial, Helvetica, sans-serif; }
  canvas { display:block; }
  #hud {
    position:fixed; top:14px; left:14px; color:#fff; z-index:10;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    font-size:20px; font-weight:bold; user-select:none;
  }
  #hud div { margin-bottom:4px; }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff; z-index:20;
    background: radial-gradient(ellipse at center, rgba(20,20,40,.85), rgba(0,0,0,.92));
    text-align:center; padding:20px; box-sizing:border-box;
  }
  #overlay h1 { font-size:42px; margin:0 0 10px; letter-spacing:2px; color:#ffcc33; text-shadow:0 0 20px rgba(255,204,51,.6); }
  #overlay p { font-size:16px; max-width:460px; line-height:1.5; opacity:.85; }
  #overlay button {
    margin-top:22px; padding:14px 34px; font-size:18px; font-weight:bold;
    border:none; border-radius:30px; background:linear-gradient(135deg,#ffcc33,#ff8800);
    color:#111; cursor:pointer; box-shadow:0 6px 18px rgba(255,140,0,.4);
  }
  #overlay button:active { transform:scale(0.97); }
  #hidden { display:none; }
  #touchControls {
    position:fixed; bottom:22px; left:0; right:0; display:flex;
    justify-content:space-between; padding:0 22px; z-index:10; pointer-events:none;
  }
  .tbtn {
    pointer-events:auto; width:70px; height:70px; border-radius:50%;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35);
    color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  .tbtn:active { background:rgba(255,255,255,.3); }
  .sec{background:#4caf50;color:#fff}.ter{background:#ff9800;color:#fff}
</style>
</head>
<body>

<div id="hud">
  <div>Punteggio: <span id="score">0</span></div>
  <div>Record: <span id="best">0</span></div>
</div>

<div id="touchControls">
  <div class="tbtn" id="btnLeft">&#8592;</div>
  <div class="tbtn" id="btnRight">&#8594;</div>
</div>

<div id="overlay">
  <h1 id="overlayTitle">SCHIVA 3D</h1>
  <p id="overlayText">Guida sull'autostrada ed evita le auto che arrivano. Usa le frecce o A/D (oppure tocca lo schermo sui bordi). La velocità aumenta col tempo: sopravvivi il più a lungo possibile!</p>
  <div id="overlayBtns" style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center;">
    <button id="startBtn">GIOCA</button> <br><button class="sec" onclick="location.href='https://github.com/lorenzo365-prog'">creatore</button>
         <br><button class="sec" onclick="location.href='https://github.com/lorenzo365-prog/schiva-il-traffico-3D/discussions/1'">commenti</button>
    <button id="homeBtn" style="display:none; background:linear-gradient(135deg,#88aaff,#3355cc); color:#fff;">HOME</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const LANES = [-3.2, 0, 3.2];
  let laneIndex = 1;
  let targetX = LANES[laneIndex];

  let scene, camera, renderer, player;
  let obstacles = [];
  let roadSegments = [];
  let running = false;
  let score = 0;
  let best = parseInt(localStorage.getItem('schiva3d_best') || '0', 10);
  document.getElementById('best').textContent = best;

  let speed = 0.28;
  const speedIncrement = 0.00035;
  let spawnTimer = 0;
  let spawnInterval = 55;

  const clock = new THREE.Clock();

  function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);
    scene.fog = new THREE.Fog(0x111122, 15, 70);

    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.set(0, 5.2, 8.5);
    camera.lookAt(0, 0.5, -10);

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0x99aaff, 0x222233, 0.8);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(-6, 12, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024,1024);
    scene.add(sun);

    // strada
    const roadWidth = 9;
    const segLength = 20;
    const roadMat = new THREE.MeshStandardMaterial({ color:0x2b2b34, roughness:0.9 });
    for (let i=0;i<6;i++){
      const seg = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, segLength), roadMat);
      seg.rotation.x = -Math.PI/2;
      seg.position.z = -i*segLength;
      seg.receiveShadow = true;
      scene.add(seg);
      roadSegments.push(seg);

      // strisce
      for (let lx of [-1.6, 1.6]){
        const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.15, segLength*0.5), new THREE.MeshBasicMaterial({color:0xffffff}));
        stripe.rotation.x = -Math.PI/2;
        stripe.position.set(lx, 0.01, seg.position.z);
        seg.userData.stripe = seg.userData.stripe || [];
        seg.userData.stripe.push(stripe);
        scene.add(stripe);
      }
    }

    // bordi erba
    const grassMat = new THREE.MeshStandardMaterial({ color:0x1c3a1f });
    const grassL = new THREE.Mesh(new THREE.PlaneGeometry(30, 260), grassMat);
    grassL.rotation.x = -Math.PI/2; grassL.position.set(-19.5, -0.01, -60);
    scene.add(grassL);
    const grassR = grassL.clone(); grassR.position.x = 19.5;
    scene.add(grassR);

    // player (auto)
    player = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color:0xff3355, metalness:0.4, roughness:0.35 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 3), bodyMat);
    body.position.y = 0.5;
    body.castShadow = true;
    player.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 1.4), new THREE.MeshStandardMaterial({color:0x222233}));
    cabin.position.set(0, 0.95, -0.1);
    player.add(cabin);
    const wheelGeo = new THREE.CylinderGeometry(0.32,0.32,0.4,12);
    const wheelMat = new THREE.MeshStandardMaterial({color:0x0a0a0a});
    [[-0.85,0.32,1.05],[0.85,0.32,1.05],[-0.85,0.32,-1.05],[0.85,0.32,-1.05]].forEach(p=>{
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI/2;
      w.position.set(p[0],p[1],p[2]);
      player.add(w);
    });
    player.position.set(targetX, 0, 3);
    scene.add(player);

    window.addEventListener('resize', onResize);
    window.addEventListener('keydown', onKey);
    document.getElementById('btnLeft').addEventListener('touchstart', e=>{e.preventDefault(); moveLeft();});
    document.getElementById('btnRight').addEventListener('touchstart', e=>{e.preventDefault(); moveRight();});
    document.getElementById('btnLeft').addEventListener('click', moveLeft);
    document.getElementById('btnRight').addEventListener('click', moveRight);

    animate();
  }

  function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function moveLeft(){ if(!running) return; laneIndex = Math.max(0, laneIndex-1); targetX = LANES[laneIndex]; }
  function moveRight(){ if(!running) return; laneIndex = Math.min(2, laneIndex+1); targetX = LANES[laneIndex]; }

  function onKey(e){
    if (['ArrowLeft','a','A'].includes(e.key)) moveLeft();
    if (['ArrowRight','d','D'].includes(e.key)) moveRight();
  }

  function spawnObstacle(){
    const lane = LANES[Math.floor(Math.random()*3)];
    const colors = [0x3399ff, 0xffcc33, 0x33cc66, 0xaa66ff, 0xff9933];
    const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)], roughness:0.4, metalness:0.3 });
    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,3), mat);
    body.position.y = 0.5; body.castShadow = true;
    car.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.5,1.4), new THREE.MeshStandardMaterial({color:0x111111}));
    cabin.position.set(0,0.95,0.2);
    car.add(cabin);
    car.position.set(lane, 0, -60);
    scene.add(car);
    obstacles.push(car);
  }

  function resetGame(){
    obstacles.forEach(o=>scene.remove(o));
    obstacles = [];
    laneIndex = 1; targetX = LANES[1];
    player.position.x = targetX;
    speed = 0.28;
    spawnInterval = 55;
    spawnTimer = 0;
    score = 0;
    document.getElementById('score').textContent = '0';
  }

  function gameOver(){
    running = false;
    best = Math.max(best, Math.floor(score));
    localStorage.setItem('schiva3d_best', best);
    document.getElementById('best').textContent = best;
    document.getElementById('overlayTitle').textContent = 'SCHIANTO!';
    document.getElementById('overlayText').textContent = 'Punteggio: ' + Math.floor(score) + '  •  Record: ' + best;
    document.getElementById('startBtn').textContent = 'RIPROVA';
    document.getElementById('homeBtn').style.display = 'inline-block';
    document.getElementById('overlay').style.display = 'flex';
  }

  function showHome(){
    running = false;
    obstacles.forEach(o=>scene.remove(o));
    obstacles = [];
    document.getElementById('overlayTitle').textContent = 'SCHIVA 3D';
    document.getElementById('overlayText').textContent = "Guida sull'autostrada ed evita le auto che arrivano. Usa le frecce o A/D (oppure tocca lo schermo sui bordi). La velocità aumenta col tempo: sopravvivi il più a lungo possibile!";
    document.getElementById('startBtn').textContent = 'GIOCA';
    document.getElementById('homeBtn').style.display = 'none';
    document.getElementById('overlay').style.display = 'flex';
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05) * 60;

    if (running){
      speed += speedIncrement * dt;
      score += speed * 0.5 * dt;
      document.getElementById('score').textContent = Math.floor(score);

      player.position.x += (targetX - player.position.x) * 0.18 * dt;
      player.rotation.z = (targetX - player.position.x) * -0.15;

      // muovi strada
      roadSegments.forEach(seg=>{
        seg.position.z += speed * dt;
        if (seg.userData.stripe) seg.userData.stripe.forEach(s=>s.position.z += speed*dt);
        if (seg.position.z > 20){
          seg.position.z -= 6*20;
          if (seg.userData.stripe) seg.userData.stripe.forEach(s=>s.position.z -= 6*20);
        }
      });

      spawnTimer += dt;
      if (spawnTimer > spawnInterval){
        spawnTimer = 0;
        spawnInterval = Math.max(28, spawnInterval - 0.4);
        spawnObstacle();
      }

      for (let i=obstacles.length-1;i>=0;i--){
        const o = obstacles[i];
        o.position.z += speed * dt;
        if (o.position.z > 12){
          scene.remove(o);
          obstacles.splice(i,1);
          continue;
        }
        const dx = Math.abs(o.position.x - player.position.x);
        const dz = Math.abs(o.position.z - player.position.z);
        if (dx < 1.5 && dz < 2.6){
          gameOver();
        }
      }
    }

    renderer.render(scene, camera);
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    document.getElementById('overlay').style.display = 'none';
    resetGame();
    running = true;
  });

  document.getElementById('homeBtn').addEventListener('click', showHome);

  init();
})();
</script>
</body>
</html>
